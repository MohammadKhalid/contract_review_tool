services:
  db:
    image: pgvector/pgvector:pg15
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
     build: ./backend
     # No ports published for prod — only the nginx reverse proxy exposes 80/443 publicly.
     # All traffic to /contracts/* etc. is routed internally by nginx.
     volumes:
       - ./backend:/app
       # Model caches use named volumes in the prod-like profile.
       # These survive container restarts but are managed internally by Docker.
       - huggingface_cache:/root/.cache/huggingface
       - spacy_models:/root/.spacy
     env_file:
       - .env
     environment:
       - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
       - SPACY_DATA=/root/.spacy
       - HF_HOME=/root/.cache/huggingface
     depends_on:
       db:
         condition: service_healthy
     healthcheck:
       test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
       interval: 30s
       timeout: 10s
       retries: 3
     profiles:
       - prod   # Use: docker compose --profile prod up   (for production-like stack)

  # Development backend with hot reload (uvicorn --reload)
  # Usage (recommended): docker compose --profile dev up db backend-dev frontend-dev
  # This is very useful when actively editing Python code (e.g. fixing seeding logic, models, etc.)
  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    volumes:
      - ./backend:/app
      # Local bind mounts for model caches (dev only).
      # Combined with matching --mount=type=bind in the Dockerfile,
      # this lets `docker compose up --build` reuse models previously
      # downloaded into .docker-cache/ on the host.
      - ./.docker-cache/huggingface:/root/.cache/huggingface
      - ./.docker-cache/spacy:/root/.spacy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - SPACY_DATA=/root/.spacy
      - PYTHONUNBUFFERED=1
      - HF_HOME=/root/.cache/huggingface
    command: >
      sh -c "
        # Create local cache directories on the *host* so bind mounts work during both runtime and build.
        mkdir -p .docker-cache/huggingface .docker-cache/spacy
        echo 'Running migrations...' &&
        alembic upgrade head &&
        echo 'Starting uvicorn with reload...' &&
        uvicorn app:app --host 0.0.0.0 --port 5001 --reload --reload-dir .
      "
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - dev

  # Production frontend (Next.js standalone)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL}
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # NEXT_PUBLIC_API_BASE_URL is now supplied at build time via the args above
      # so the value is baked into the client JS bundle (see frontend/Dockerfile
      # and src/lib/api.ts). The value below is only for any server-side code
      # that might read process.env at runtime.
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:5001}
      # Polar credentials (required for the buy flow / BFF routes at runtime)
      - POLAR_ACCESS_TOKEN=${POLAR_ACCESS_TOKEN}
      - POLAR_ORGANIZATION_ID=${POLAR_ORGANIZATION_ID}
      - POLAR_SERVER=${POLAR_SERVER:-sandbox}
      - POLAR_WEBHOOK_SECRET=${POLAR_WEBHOOK_SECRET}
      # POLAR_ANALYSIS_PRODUCT_ID is required for dynamic checkout creation.
      - POLAR_ANALYSIS_PRODUCT_ID=${POLAR_ANALYSIS_PRODUCT_ID}
    depends_on:
      - backend
    profiles:
      - prod   # Use: docker compose --profile prod up   (for production-like stack)

  # Production reverse proxy (nginx). Only public entrypoint (ports 80/443).
  # Routes the frontend (incl. all Next.js BFF /api routes + /api/webhook/polar)
  # and the backend APIs. TLS certs (if present) are mounted from ./nginx/certs.
  # See nginx/README.md for certbot steps.
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    profiles:
      - prod

  # Development frontend with hot reload
  # Part of the dev profile. Start with: docker compose --profile dev up db backend-dev frontend-dev
  frontend-dev:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:5001
      - WATCHPACK_POLLING=true
      # Polar credentials (required for the embedded checkout / buy flow)
      - POLAR_ACCESS_TOKEN=${POLAR_ACCESS_TOKEN}
      - POLAR_ORGANIZATION_ID=${POLAR_ORGANIZATION_ID}
      - POLAR_SERVER=${POLAR_SERVER:-sandbox}
      - POLAR_WEBHOOK_SECRET=${POLAR_WEBHOOK_SECRET}
      # POLAR_ANALYSIS_PRODUCT_ID is required for dynamic checkout creation.
      - POLAR_ANALYSIS_PRODUCT_ID=${POLAR_ANALYSIS_PRODUCT_ID}
    command: sh -c "npm install --legacy-peer-deps && npm run dev"
    depends_on:
      - backend-dev
    profiles:
      - dev

volumes:
  postgres_data:
  # Named volumes used by the production-like "prod" profile.
  # In the "dev" profile we prefer local bind mounts (.docker-cache/) for better visibility.
  huggingface_cache:
  spacy_models: