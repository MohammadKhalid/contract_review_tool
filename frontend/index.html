<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>German Rental Contract Review Tool</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>German Rental Contract Review Tool</h1>
        <p>Upload your German rental contract (PDF or text file) for analysis</p>

        <div class="upload-section">
            <input type="file" id="fileInput" accept=".pdf,.txt">
            <button id="analyzeBtn">Analyze Contract</button>
        </div>

        <div id="loading" class="loading" style="display: none;">
            Analyzing contract...
        </div>

        <div id="results" class="results" style="display: none;">
            <h2>Analysis Results</h2>
            <div id="filename"></div>
            <div class="analysis-section">
                <h3>Basic Statistics</h3>
                <div id="stats"></div>
            </div>
            <div class="analysis-section">
                <h3>Key Terms Found</h3>
                <div id="keyTerms"></div>
            </div>
            <div class="analysis-section">
                <h3>Named Entities</h3>
                <div id="entities"></div>
            </div>
            <div class="analysis-section">
                <h3>Potential Issues</h3>
                <div id="issues"></div>
            </div>
        </div>

        <div id="error" class="error" style="display: none;"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
