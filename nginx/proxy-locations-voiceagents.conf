# VoiceAgents FastAPI (container: voiceagents-api:5000 on network "edge")
#
# Access (no conflict with Contract Hero /docs, /health, /openapi.json):
#   http://SERVER_IP/v1-docs
#   http://SERVER_IP/v1/...
#   https://contract-hero.com/v1-docs
#   https://contract-hero.com/v1/...

client_max_body_size 50m;

# Swagger UI (+ its static assets under /v1-docs/)
location /v1-docs {
    proxy_pass http://voiceagents;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
}

# API + OpenAPI schema at /v1/openapi.json + ReDoc at /v1/redoc
location /v1/ {
    proxy_pass http://voiceagents;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    client_max_body_size 50m;
}

# VoiceAgents health (Contract Hero keeps /health)
location = /va-health {
    proxy_pass http://voiceagents/health;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
