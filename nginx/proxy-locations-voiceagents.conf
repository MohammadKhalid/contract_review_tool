# VoiceAgents FastAPI — dynamic upstream (Docker DNS)
#
# Uses a variable in proxy_pass so nginx does NOT require voiceagents-api
# to exist at process start (avoids: host not found in upstream).
#
# Container must be reachable as: voiceagents-api:5000 on network "edge"

# Override host if needed via: set $voiceagents_host "...";
set $voiceagents_host voiceagents-api;

client_max_body_size 50m;

# Swagger UI
location /v1-docs {
    proxy_pass http://$voiceagents_host:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
}

location /v1-docs/ {
    proxy_pass http://$voiceagents_host:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
}

# API (+ /v1/openapi.json, /v1/redoc)
location /v1/ {
    proxy_pass http://$voiceagents_host:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    client_max_body_size 50m;
}

# Health (Contract Hero keeps /health)
location = /va-health {
    proxy_pass http://$voiceagents_host:5000/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
}
