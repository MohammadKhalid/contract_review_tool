# Reverse proxy on Hetzner VPS:
#   contract-hero.com  → Contract Hero (frontend + backend)
#   http://SERVER_IP/* → VoiceAgents (/v1, /v1-docs) when voiceagents-api is up
#
# VoiceAgents also on https://contract-hero.com/v1 and /v1-docs (for Vercel).
#
# Requires: docker network create edge
# VoiceAgents must join "edge" as container voiceagents-api

upstream frontend {
    server frontend:3000;
}

upstream backend {
    server backend:5001;
}

# NOTE: Do NOT put voiceagents-api in a static "upstream {}" block.
# nginx resolves those at startup and exits with [emerg] if the container
# is missing. VoiceAgents is proxied via Docker DNS + variables
# (see proxy-locations-voiceagents.conf).

# ═══════════════════════════════════════════════════════════════════════════════
# Default server — access by VPS IP (e.g. http://1.2.3.4/v1-docs)
# ═══════════════════════════════════════════════════════════════════════════════

server {
    listen 80 default_server;
    server_name _;

    # Docker embedded DNS — resolve voiceagents-api at request time
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Server-level size limit (IP vhost only includes voiceagents locations)
    client_max_body_size 50m;

    include /etc/nginx/proxy-locations-voiceagents.conf;
}

# ═══════════════════════════════════════════════════════════════════════════════
# contract-hero.com
# ═══════════════════════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name contract-hero.com www.contract-hero.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name contract-hero.com www.contract-hero.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Large webhook payloads (e.g. ElevenLabs post_call_audio base64 MP3)
    # Also set per-location under /v1/ in proxy-locations-voiceagents.conf
    client_max_body_size 50m;

    # Contract Hero (static upstreams — always present when this stack starts)
    include /etc/nginx/proxy-locations.conf;

    # VoiceAgents (dynamic DNS — OK if API is down; those paths return 502)
    include /etc/nginx/proxy-locations-voiceagents.conf;
}
