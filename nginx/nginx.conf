# Reverse proxy on Hetzner VPS:
#   contract-hero.com  → Contract Hero (frontend + backend)  [unchanged]
#   http://SERVER_IP/* → VoiceAgents API paths only
#
# VoiceAgents also exposed under contract-hero.com at /v1 and /v1-docs so a
# Vercel frontend can call HTTPS without mixed-content issues.
#
# Requires: docker network create edge
# VoiceAgents container must be on "edge" as voiceagents-api:5000

upstream frontend {
    server frontend:3000;
}

upstream backend {
    server backend:5001;
}

upstream voiceagents {
    server voiceagents-api:5000;
}

# ═══════════════════════════════════════════════════════════════════════════════
# Default server — access by VPS IP (e.g. http://1.2.3.4/v1-docs)
# ═══════════════════════════════════════════════════════════════════════════════

server {
    listen 80 default_server;
    server_name _;

    include /etc/nginx/proxy-locations-voiceagents.conf;
}

# ═══════════════════════════════════════════════════════════════════════════════
# contract-hero.com
# ═══════════════════════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name contract-hero.com www.contract-hero.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name contract-hero.com www.contract-hero.com;

    # Existing cert layout (flat certs/ directory)
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Contract Hero app (original routes)
    include /etc/nginx/proxy-locations.conf;

    # VoiceAgents API + Swagger on the same host (for Vercel → HTTPS)
    # Paths do not overlap with Contract Hero (/docs vs /v1-docs, /contracts vs /v1)
    include /etc/nginx/proxy-locations-voiceagents.conf;
}
